<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#grad)"/>
  
  <!-- Harmonic Orbitals -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.15"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.3"/>
  
  <!-- Stylized Pen Nib -->
  <path d="M256 136 L196 300 L256 364 L316 300 Z" fill="#f8fafc" filter="url(#glow)"/>
  <path d="M256 136 L196 300 L256 364 L316 300 Z" fill="url(#grad)" opacity="0.1"/> <!-- Depth shading -->
  
  <!-- Ink Slit -->
  <path d="M256 364 L256 280" stroke="#020617" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="260" r="12" fill="#020617" opacity="0.3"/>
  
  <!-- Harmonic Ink Flow -->
  <path d="M256 364 C 256 364, 256 460, 160 460 C 80 460, 60 380, 100 320" 
        fill="none" 
        stroke="#22d3ee" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"
  />
</svg>